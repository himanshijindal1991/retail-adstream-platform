spring.application.name=insights-api
server.port=8080

# H2 embedded database
spring.datasource.url=jdbc:h2:mem:retail_analytics
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

spring.jpa.open-in-view=false
# Demo-only users: supply secrets through environment, never commit passwords.
demo.security.target-password=${TARGET_DEMO_PASSWORD}
demo.security.walmart-password=${WALMART_DEMO_PASSWORD}

# Tenant-specific configuration (illustrative; not yet enforced by Flink or rate limiter)
retail.tenants.T001.attribution-hours=24
retail.tenants.T001.retention-days=90
retail.tenants.T001.api-quota-per-minute=100
retail.tenants.T002.attribution-hours=48
retail.tenants.T002.retention-days=180
retail.tenants.T002.api-quota-per-minute=100
